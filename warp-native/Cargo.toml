[package]
name = "warp-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Embedded Cloudflare WARP tunnel (WireGuard + MASQUE) exposing a local SOCKS5 proxy"

[lib]
name = "warp_native"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "net",
  "io-util",
] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
uniffi = { version = "0.32", features = ["cli"] }

# WireGuard (classic WARP transport)
warp-wireguard-gen = { version = "0.1", features = ["serde"] }
wireguard-netstack = "0.3"

# MASQUE (CONNECT-IP / RFC 9484) transport
usque-cloudflare-api = { git = "https://github.com/FireMasterK/usque-rs" }
usque-config = { git = "https://github.com/FireMasterK/usque-rs" }
usque-crypto = { git = "https://github.com/FireMasterK/usque-rs" }
usque-masque = { git = "https://github.com/FireMasterK/usque-rs" }
usque-tunnel-core = { git = "https://github.com/FireMasterK/usque-rs" }
usque-virtual-net = { git = "https://github.com/FireMasterK/usque-rs" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

# Upstream `h3` 0.0.8 hardcodes the `:protocol` tokens it knows about and
# rejects Cloudflare's `cf-connect-ip` (the token used by `usque-masque`).
# The vendored copy only adds the two CONNECT-IP tokens, nothing else.
[patch.crates-io]
h3 = { path = "vendor/h3" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "symbols"
